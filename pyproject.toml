[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-empirical"
version = "0.1.0"
description = "Bounded TypeSafe Jev diagnostic benchmark; no runtime dependencies"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
jev-bench = "jev_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
